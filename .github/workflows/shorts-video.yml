name: Render Shorts video

# Renders a vertical (1080x1920) 30 second action Short of the Godot Lost City on a GitHub server:
# Godot's movie maker plays two scripted shots (godot/tests/short.gd) on a software renderer, then ffmpeg
# joins them with captions (tools/shorts/compose.sh). Run it by hand from the Actions tab; the finished
# video is in the run's Artifacts as short-final, the raw clips as short-clips, a test still as probe.
on:
  workflow_dispatch:
    inputs:
      seed_freeze:
        description: "Seed of the suspense shot (changes where it happens)"
        default: "3"
      seed_chase:
        description: "Seed of the chase shot"
        default: "5"

permissions:
  contents: read

env:
  GODOT_VERSION: 4.6.2

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4

      - name: Install the software GPU, a virtual screen and ffmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb mesa-vulkan-drivers libvulkan1 vulkan-tools ffmpeg \
            libxcursor1 libxinerama1 libxi6 libxrandr2 libgl1 libpulse0
          sudo apt-get install -y libasound2t64 || sudo apt-get install -y libasound2
          vulkaninfo --summary | head -25 || true

      - name: Cache Godot
        id: cache
        uses: actions/cache@v4
        with:
          path: ~/godot
          key: godot-${{ env.GODOT_VERSION }}-editor

      - name: Download Godot
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          base="https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable"
          mkdir -p ~/godot
          curl -fsSL --retry 3 "$base/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip" -o godot.zip
          unzip -q godot.zip -d ~/godot
          mv ~/godot/Godot_v${GODOT_VERSION}-stable_linux.x86_64 ~/godot/godot
          rm godot.zip

      - name: Import the project
        working-directory: godot
        run: ~/godot/godot --headless --path . --import

      - name: Check the director script
        working-directory: godot
        run: |
          out=$(~/godot/godot --headless --path . --check-only -s res://tests/short.gd 2>&1) || true
          echo "$out"
          if echo "$out" | grep -q "SCRIPT ERROR"; then exit 1; fi

      - name: Probe, one still frame at 1080x1920 on the software renderer
        run: |
          mkdir -p out
          start=$(date +%s)
          xvfb-run -a -s "-screen 0 1080x1920x24" ~/godot/godot --path godot --rendering-driver vulkan \
            --audio-driver Dummy --resolution 1080x1920 --fixed-fps 30 -- --play --shot="$GITHUB_WORKSPACE/out/probe.png" --frames=45
          echo "probe took $(( $(date +%s) - start )) s for 45 frames"
          test -s out/probe.png

      - name: Record the suspense shot
        run: |
          start=$(date +%s)
          xvfb-run -a -s "-screen 0 1080x1920x24" ~/godot/godot --path godot --rendering-driver vulkan \
            --audio-driver Dummy --resolution 1080x1920 --fixed-fps 30 --write-movie "$GITHUB_WORKSPACE/out/freeze.avi" \
            -s res://tests/short.gd -- --shot=freeze --seed=${{ inputs.seed_freeze }} --len=14 --beat=7
          echo "freeze shot took $(( $(date +%s) - start )) s"
          test -s out/freeze.avi

      - name: Record the chase shot
        run: |
          start=$(date +%s)
          xvfb-run -a -s "-screen 0 1080x1920x24" ~/godot/godot --path godot --rendering-driver vulkan \
            --audio-driver Dummy --resolution 1080x1920 --fixed-fps 30 --write-movie "$GITHUB_WORKSPACE/out/chase.avi" \
            -s res://tests/short.gd -- --shot=chase --seed=${{ inputs.seed_chase }} --len=14 --flare=4.5
          echo "chase shot took $(( $(date +%s) - start )) s"
          test -s out/chase.avi

      - name: Join the clips with captions
        run: bash tools/shorts/compose.sh out/freeze.avi out/chase.avi out/short.mp4

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: short-final
          path: out/short.mp4
          retention-days: 14
          if-no-files-found: ignore

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: short-clips
          path: |
            out/freeze.avi
            out/chase.avi
          retention-days: 7
          if-no-files-found: ignore

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: probe
          path: out/probe.png
          retention-days: 7
          if-no-files-found: ignore
