name: Render Shorts video

# Renders vertical (1080x1920) daylight action Shorts of the Godot Lost City on a GitHub server: Godot's movie
# maker plays a scripted shot (godot/tests/short.gd) on a software renderer, then ffmpeg adds captions
# (tools/shorts/compose.sh). One video per seed, side by side, so the best one can be picked.
# The videos and a contact sheet of each are in the run's Artifacts (short-seed-N), visible to people signed in to GitHub.
on:
  push:
    branches: [shorts-video]
    paths: ["godot/tests/short.gd", "tools/shorts/**", ".github/workflows/shorts-video.yml"]
  workflow_dispatch:
    inputs:
      shot:
        description: "carchase, chase or freeze"
        default: "carchase"
      seeds:
        description: "Seeds to render, as a JSON list (each changes where and how it plays out)"
        default: "[1,2,3]"

permissions:
  contents: read

env:
  GODOT_VERSION: 4.6.2

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    strategy:
      fail-fast: false
      matrix:
        seed: ${{ fromJSON(github.event.inputs.seeds || '[1,2,3]') }}
    env:
      SHOT: ${{ github.event.inputs.shot || 'carchase' }}
    steps:
      - uses: actions/checkout@v4

      - name: Install the software GPU, a virtual screen and ffmpeg
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb mesa-vulkan-drivers libvulkan1 ffmpeg \
            libxcursor1 libxinerama1 libxi6 libxrandr2 libgl1 libpulse0
          sudo apt-get install -y libasound2t64 || sudo apt-get install -y libasound2

      - name: Cache Godot
        id: cache
        uses: actions/cache@v4
        with:
          path: ~/godot
          key: godot-${{ env.GODOT_VERSION }}-editor

      - name: Download Godot
        if: steps.cache.outputs.cache-hit != 'true'
        run: |
          base="https://github.com/godotengine/godot/releases/download/${GODOT_VERSION}-stable"
          mkdir -p ~/godot
          curl -fsSL --retry 3 "$base/Godot_v${GODOT_VERSION}-stable_linux.x86_64.zip" -o godot.zip
          unzip -q godot.zip -d ~/godot
          mv ~/godot/Godot_v${GODOT_VERSION}-stable_linux.x86_64 ~/godot/godot
          rm godot.zip

      - name: Import the project
        working-directory: godot
        run: ~/godot/godot --headless --path . --import

      - name: Check the director script
        working-directory: godot
        run: |
          out=$(~/godot/godot --headless --path . --check-only -s res://tests/short.gd 2>&1) || true
          echo "$out"
          if echo "$out" | grep -q "SCRIPT ERROR"; then exit 1; fi

      - name: Record the shot
        run: |
          mkdir -p out
          # this CI copy of the project is portrait: its landscape window override would beat --resolution
          sed -i '/window\/size\/window_\(width\|height\)_override/d; s/viewport_width=844/viewport_width=1080/; s/viewport_height=390/viewport_height=1920/' godot/project.godot
          grep -n "window/size" godot/project.godot
          set -o pipefail
          start=$(date +%s)
          xvfb-run -a -s "-screen 0 1080x1920x24" ~/godot/godot --path godot --rendering-driver vulkan \
            --audio-driver Dummy --resolution 1080x1920 --fixed-fps 30 --write-movie "$GITHUB_WORKSPACE/out/clip.avi" \
            -s res://tests/short.gd -- --mode=$SHOT --seed=${{ matrix.seed }} --len=26 --bite=14 2>&1 | tee godot.log
          echo "recording took $(( $(date +%s) - start )) s"
          test -s out/clip.avi
          # what happened, as annotations on the run page: the clip's length, the second-by-second trace, and any errors
          info=$(ffprobe -v error -show_entries format=duration,size:stream=width,height -of compact=p=0 out/clip.avi | tr '\n' ' ')
          echo "::notice title=clip seed ${{ matrix.seed }}::${info}"
          trace=$(grep -E '^(t=|shot )' godot.log | sed 's/%/pct/g' | sed 's/$/%0A/' | tr -d '\n')
          echo "::notice title=trace seed ${{ matrix.seed }}::${trace}"
          errs=$(grep -E 'ERROR|WARNING' godot.log | head -12 | sed 's/%/pct/g' | sed 's/$/%0A/' | tr -d '\n')
          if [ -n "$errs" ]; then echo "::warning title=godot errors seed ${{ matrix.seed }}::${errs}"; fi

      - name: Add captions
        run: |
          # captions are timed from what actually happened in the clip (EVENT lines of the director)
          ev() { grep -m1 "^EVENT $1 " godot.log | awk '{print $3}' || true; }
          add() { awk -v a="$1" -v b="$2" 'BEGIN { printf "%.1f", a + b }'; }
          bite=$(ev bite); tumble=$(ev tumble); end=$(ev end); end=${end:-26}
          caps=("IT IS RIGHT BEHIND YOU|0.3|2.4")
          if [ -n "$bite" ]; then
            if awk -v b="$bite" 'BEGIN { exit !(b > 5) }'; then caps+=("FLOOR IT|2.7|$(add "$bite" -0.5)"); fi
            caps+=("IT GOT THE CAR|$(add "$bite" -0.1)|$(add "$bite" 1.8)")
          fi
          if [ -n "$tumble" ]; then caps+=("IT THREW THE CAR|$(add "$tumble" 0)|$(add "$tumble" 1.7)"); fi
          caps+=("DID HE MAKE IT?|$(add "$end" -0.4)|$(add "$end" 1.9)")
          printf '%s\n' "${caps[@]}"
          bash tools/shorts/compose.sh out/short.mp4 out/clip.avi "${caps[@]}"
          mv out/short.mp4 out/${SHOT}_seed${{ matrix.seed }}.mp4
          mv out/short_sheet.png out/${SHOT}_seed${{ matrix.seed }}_sheet.png
          echo "::notice title=final video seed ${{ matrix.seed }}::$(ffprobe -v error -show_entries format=duration -of csv=p=0 out/${SHOT}_seed${{ matrix.seed }}.mp4) seconds"

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: short-seed-${{ matrix.seed }}
          path: |
            out/*.mp4
            out/*_sheet.png
          retention-days: 14
          if-no-files-found: ignore
